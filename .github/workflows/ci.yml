name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-contract:
    name: Data-layer contract
    # pinned (not ubuntu-latest) so the gate's environment is predictable
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Validate data layer (foreign keys + effect vocabulary)
        run: node tools/validate_data.js out
      - name: Unit-test the validator checks (one function per check class)
        run: node tools/validate.test.js
      - name: Emit the structured result (machine-readable artifact)
        run: node tools/validate_data.js out --json > validate-report.json
      - name: Entity coverage matrix (54 entities x data surfaces)
        run: node tools/validate_data.js out --report

      - name: Export-schema parity with the generation pipeline
        # N2：本仓没有 pipeline/（生成器在备份仓），此步会打印 SKIP 并 exit 0；
        # 同一脚本在备份仓的 CI 里才真正做对账。放在这里是为了让脚本本身也进 CI。
        run: node tools/check_export_schema.js out

      - name: Service-worker precache matches the shipped files
        # O2：sw.js 的 PRECACHE 现在是生成物 —— 新增/删除发布文件却忘了同步清单，
        # 离线时就会 404。清单不一致即失败（用 --update 重新生成，并 bump CACHE_VERSION）。
        run: node tools/sw_manifest.js out
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validate-report
          path: validate-report.json
          if-no-files-found: warn

  probes:
    name: Headless probes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Locate a Chromium-family browser
        run: |
          set -euo pipefail
          for c in google-chrome google-chrome-stable chromium chromium-browser msedge; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "W1980_BROWSER=$(command -v "$c")" >> "$GITHUB_ENV"
              echo "using $c at $(command -v "$c")"
              exit 0
            fi
          done
          echo "::error::no Chromium-family browser found on this runner" >&2
          exit 1

      - name: Run all headless probes (assertions)
        run: python tools/probe_runner.py run out tools/probe-results.json

      - name: Report assertion coverage per probe
        # Informational + auditable: this table is how you see, at a glance,
        # that a refactor did not quietly shrink what the suite guarantees.
        run: python tools/probe_runner.py count tools/probe-results.json

      - name: Compare against the committed baseline (regression gate)
        # Also fails when any probe carries FEWER assertions than the baseline
        # (printed as "ASSERTION COLLAPSE"). Growth is allowed: new coverage is
        # normal, losing coverage is how a green suite silently stops testing.
        run: python tools/probe_runner.py cmp tools/baseline-probes.json tools/probe-results.json

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-results
          path: tools/probe-results.json
          if-no-files-found: warn
